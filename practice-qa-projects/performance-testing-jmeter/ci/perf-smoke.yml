# Example GitHub Actions workflow: a short performance smoke test as a pull request gate.
# To use it, copy this file to .github/workflows/perf-smoke.yml at the root of a repository
# that contains this tutorial folder (adjust TUTORIAL_DIR if you move it).
name: perf-smoke

on:
  pull_request:
  workflow_dispatch:

env:
  JMETER_VERSION: "5.6.3"
  TUTORIAL_DIR: practice-qa-projects/performance-testing-jmeter

jobs:
  perf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify JMeter
        run: |
          cd "$RUNNER_TEMP"
          base="https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz"
          curl -sSfL -o jmeter.tgz "$base"
          curl -sSfL -o jmeter.tgz.sha512 "$base.sha512"
          echo "$(cut -d' ' -f1 jmeter.tgz.sha512)  jmeter.tgz" | sha512sum -c -
          tar -xzf jmeter.tgz
          echo "JMETER_HOME=$RUNNER_TEMP/apache-jmeter-${JMETER_VERSION}" >> "$GITHUB_ENV"

      - name: Start the app under test
        run: |
          python "$TUTORIAL_DIR/demo-app/shop_api.py" --port 8099 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8099/health && break; sleep 1; done

      - name: Performance smoke test (fails the job if the SLO fails)
        run: |
          python "$TUTORIAL_DIR/scripts/run_test.py" \
            --users 20 --rampup 10 --duration 60 --name ci-smoke \
            --p95-ms 800 --max-error-pct 1

      - name: Upload results and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-results
          path: ${{ env.TUTORIAL_DIR }}/results/
