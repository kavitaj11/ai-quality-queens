name: Shipping checks
on: [push, pull_request]
jobs:
  boundary-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa_foundational_knowledge/quality-engineering/test-automation-in-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: javac -d "$RUNNER_TEMP" examples/java/*.java
      - run: java -cp "$RUNNER_TEMP" guide.ShippingTest
      - run: mvn --batch-mode -f examples/cucumber/pom.xml test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cucumber-test-results
          path: '**/surefire-reports/**'
