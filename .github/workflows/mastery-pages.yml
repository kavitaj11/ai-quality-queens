name: Deploy QA Automation Mastery to Pages
on:
  push:
    branches: [main]
    paths:
      - 'QA Automation Mastery System/**'
      - '.github/workflows/mastery-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mastery-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: python3 "QA Automation Mastery System/web/build.py" _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
